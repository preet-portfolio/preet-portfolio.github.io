  <g fill="none" stroke="#f3f6f2" stroke-opacity=".8" stroke-width="1.1">
    <rect x="3.5" y="7" width="25" height="18" rx=".6"/>
    <path d="M16 7v18"/>
    <circle cx="16" cy="16" r="3.4"/>
    <path d="M3.5 11.5h4v9h-4M28.5 11.5h-4v9h4"/>
  </g>
  <path d="M8.5 21.5 14 12.5 21 18.5 28.5 16" fill="none" stroke="#e2b94b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e2b94b">
    <circle cx="8.5" cy="21.5" r="1.7"/>
    <circle cx="14" cy="12.5" r="1.7"/>
    <circle cx="21" cy="18.5" r="1.7"/>
  </g>
  <circle cx="28.5" cy="16" r="2.1" fill="#fff" stroke="#17202b" stroke-width=".8"/>
